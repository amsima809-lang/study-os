<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo mark: a dotted trail that turns into a tick">
  <!-- The trail: three steps, each a little bigger -->
  <circle cx="9.500" cy="27" r="3.200" fill="currentColor" opacity=".55"/>
  <circle cx="16.800" cy="35.200" r="3.900" fill="currentColor" opacity=".75"/>
  <circle cx="25" cy="44" r="4.700" fill="currentColor"/>
  <!-- ...and where it leads: the long stroke of a tick -->
  <path d="M33.500 46.500 53.500 15.500" fill="none" stroke="var(--logo-tick, currentColor)" stroke-width="9.400" stroke-linecap="round"/>
</svg>
