<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo mark: an open book set down like a mountain, with a marker flag on the summit">
  <!-- An open book laid face down makes a ridge: two pages, two slopes -->
  <path fill="currentColor" opacity=".55" d="M30 20 7.600 48.800C6.300 50.500 7.500 53 9.600 53H30z"/>
  <path fill="currentColor" d="M30 20v33h24.400c2.100 0 3.300-2.500 2-4.200z"/>
  <!-- The summit marker -->
  <path d="M30 22V7" fill="none" stroke="currentColor" stroke-width="3.600" stroke-linecap="round"/>
  <path fill="var(--logo-tick, currentColor)" d="M31.800 6.300c0-1.100 1.200-1.800 2.200-1.300l9.300 4.700c1.200 0.600 1.200 2.300 0 2.900L34 17.300c-1 0.500-2.200-0.200-2.200-1.300z"/>
</svg>
