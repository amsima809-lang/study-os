      <rect width="64" height="64" fill="#fff"/>
      <path d="M21 56c8-1.300 14-4.800 14-9.800 0-5.200-8.500-5.700-8.500-11.200 0-3.600 2.800-6.200 6-8.600" fill="none" stroke="#000" stroke-width="4.200" stroke-linecap="round"/>
    </mask>
  </defs>
