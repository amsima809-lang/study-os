<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo mark: a trail winding up a mountain to a flag on the summit">
  <defs>
    <mask id="trail-to-top">
      <rect width="64" height="64" fill="#fff"/>
      <!-- the trail, cut out of the mountain: it starts at the foot and ends at the flag -->
      <path d="M16.500 55c7-1.200 12.500-4.300 12.500-8.800 0-4.700-7.500-5.200-7.500-10.200 0-3.400 2.600-5.800 5.500-8" fill="none" stroke="#000" stroke-width="3.800" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- The far peak -->
  <path fill="currentColor" opacity=".5" d="M42.900 33.200c1-1.500 3.200-1.500 4.200 0l11.700 17.100c1 1.400 0 3.300-1.700 3.300H36z"/>
  <!-- The mountain, with the trail -->
  <path fill="currentColor" mask="url(#trail-to-top)" d="M24.700 21.700c1.100-1.700 3.500-1.700 4.600 0L48.600 50.800c0.900 1.200 0 2.800-1.500 2.800H6.900c-1.500 0-2.400-1.600-1.500-2.800z"/>
  <!-- The flag at the top: the end of the trail -->
  <path d="M27 22V7.500" fill="none" stroke="currentColor" stroke-width="3.600" stroke-linecap="round"/>
  <path fill="var(--logo-tick, currentColor)" d="M28.800 6.800c0-1.200 1.200-1.900 2.300-1.400l10.200 5c1.200 0.600 1.200 2.300 0 2.900l-10.200 5c-1.100 0.500-2.300-0.200-2.300-1.400z"/>
</svg>
