  <rect x="15" y="27.500" width="38" height="11.500" rx="5.750" fill="currentColor" opacity=".6" transform="rotate(-3 34 33)"/>
  <rect x="20" y="13.500" width="24" height="11" rx="5.500" fill="var(--logo-tick, currentColor)" transform="rotate(4 32 19)"/>
</svg>
