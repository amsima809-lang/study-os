<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo mark: two peaks with a trail climbing the nearer one toward the sun">
  <defs>
    <mask id="trail-up">
      <rect width="64" height="64" fill="#fff"/>
      <!-- the trail, cut out of the mountain -->
      <path d="M15 53c7-1.500 12-4.500 12-8.500 0-4.500-6-5-6-9.500 0-3 2.500-5 6-6" fill="none" stroke="#000" stroke-width="3.600" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- The sun the climb is heading for -->
  <circle cx="47" cy="15" r="7" fill="var(--logo-tick, currentColor)"/>
  <!-- The far peak -->
  <path fill="currentColor" opacity=".5" d="M40.500 30.500c1-1.500 3.100-1.500 4.100 0l13.300 19.200c1 1.400 0 3.300-1.700 3.300H32z"/>
  <!-- The near peak, with the trail -->
  <path fill="currentColor" mask="url(#trail-up)" d="M24.900 19.800c1.100-1.700 3.500-1.700 4.600 0l20.600 30.400c0.900 1.200 0 2.800-1.500 2.800H8.300c-1.500 0-2.400-1.600-1.500-2.800z"/>
</svg>
