# fly.toml app configuration file generated for studyos-ansima on 2026-09-29T14:57:34+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'studyos-ansima'
primary_region = 'sin'

[build]
[env]
  DB_PATH = '/data/studyos.db'
  NODE_ENV = 'production'
  PORT = '8080'
  TZ = 'Asia/Bangkok'
  UPLOAD_DIR = '/data/uploads'

[[mounts]]
  source = 'studyos_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
