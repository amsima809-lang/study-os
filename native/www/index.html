<!doctype html>
<!--
  Shown by the iOS shell when the site cannot be reached (capacitor.config.json: server.errorPath).
  It is the only page inside the app itself; everything else is the live web app.
  Plain HTML on purpose: no build step, nothing to load.
-->
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
        padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
        box-sizing: border-box; text-align: center;
        background: #4f46e5; color: #fff;
        font: 17px/1.5 -apple-system, "Thonburi", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 1.375rem; margin: 0; }
      p { margin: 0; max-width: 22rem; }
      .en { opacity: 0.8; font-size: 0.9375rem; }
      button {
        min-height: 44px; padding: 0 1.5rem; border: 0; border-radius: 999px;
        background: #fff; color: #4338ca; font: inherit; font-weight: 600;
      }
      button:active { opacity: 0.8; }
      @media (prefers-reduced-motion: no-preference) { button { transition: opacity 0.15s; } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1 id="name"></h1>
    <div>
      <p>เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่</p>
      <p class="en">Cannot connect. Check your internet connection and try again.</p>
    </div>
    <button type="button" id="retry">ลองใหม่ · Try again</button>
    <script>
      var APP_NAME = "Termtrail"; // @app-name
      // The site the app shows. The shell tells the page (WEBVIEW_SERVER_URL); the copy below is
      // only for when it does not, and server/test/brand.test.ts keeps it equal to the config.
      var APP_URL = "https://amsima.com/termtrail/"; // @app-url
      var home = typeof window.WEBVIEW_SERVER_URL === "string" && /^https:/.test(window.WEBVIEW_SERVER_URL) ? window.WEBVIEW_SERVER_URL : APP_URL;
      document.getElementById("name").textContent = APP_NAME;
      document.title = APP_NAME;
      function retry() { window.location.replace(home); }
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry); // back on the network: go without being asked
    </script>
  </body>
</html>
